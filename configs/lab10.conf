# 实验 10 自建 DNS —— 改动后：sudo dnsmasq --test -C /etc/dnsmasq.d/lab10.conf && sudo systemctl restart dnsmasq

# ① 只在 ens33 上提供服务，不绑 0.0.0.0（避开 systemd-resolved 的 127.0.0.53）
interface=ens33
bind-dynamic

# ② lab.local 是本地区，查不到就回 NXDOMAIN，绝不转发
local=/lab.local/

# ③ 本地记录
host-record=www.lab.local,192.168.9.50
host-record=ns.lab.local,192.168.9.50

# ④ 上游：显式指定，且不读 /etc/resolv.conf（它指向 127.0.0.53，会成环）
no-resolv
server=192.168.9.2

# ⑤ 缓存与查询日志
cache-size=1000
log-queries
log-facility=/var/log/dnsmasq.log

# ⑥ 对照后缀：.test 是 RFC 6761 保留的测试域，不会撞 mDNS
local=/lab.test/
host-record=www.lab.test,192.168.9.50

# ⑦ 泛解析：*.wild.lab.test 全部指向同一个地址（生产中常用于把子域批量指到内网某台机）
address=/wild.lab.test/192.168.9.222

# ⑧ 第二个上游：阿里 DNS，做冗余
server=223.5.5.5
